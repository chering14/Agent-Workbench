[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-workbench"
version = "2.0.0"
description = "A local multi-model software team with task handoffs, skills, MCP and complete tutorials."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.153.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "python-dotenv==1.2.4",
    "mcp==2.3.0",
    "keyring==25.7.0",
    "playwright==1.64.0",
    "jsonschema==4.26.0",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.1"]

[project.scripts]
agent-workbench = "agent_workbench.__main__:main"

[tool.setuptools.packages.find]
include = ["agent_workbench*"]

[tool.setuptools.package-data]
agent_workbench = ["data/*.json", "web/*.html", "web/*.css", "web/*.js", "tutorials/*.md", "tutorials/*.json", "tutorials/team/*", "team_web/*", "team_assets/skills/*/*.md", "team_assets/plugins/*/*.json", "team_assets/plugins/*/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
